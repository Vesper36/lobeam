name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --silent
          npm run build

      - name: Build server binaries
        run: |
          mkdir -p dist
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              echo "Building mimo-$GOOS-$GOARCH..."
              CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o dist/mimo-$GOOS-$GOARCH$EXT ./cmd/mimo/
              echo "Building mimo-cli-$GOOS-$GOARCH..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o dist/mimo-cli-$GOOS-$GOARCH$EXT ./cmd/mimo-cli/
            done
          done

      - name: Create Docker image
        run: docker build -t mimo:${{ github.ref_name }} -t mimo:latest .

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mimo-*
            dist/checksums.txt
          draft: true
          generate_release_notes: true
          body: |
            ## MIMO ${{ github.ref_name }}

            Self-hosted file transfer platform with E2E encryption, P2P direct transfer, and enterprise features.

            ### Installation

            **Docker (recommended):**
            ```bash
            docker run -d -p 8080:8080 -v mimo-data:/data mimo/mimo:latest
            ```

            **Single binary:**
            ```bash
            # Linux/macOS
            curl -L https://github.com/Vesper36/mimo/releases/download/${{ github.ref_name }}/mimo-linux-amd64 -o mimo
            chmod +x mimo
            ./mimo
            ```

            **Homebrew:**
            ```bash
            brew install mimo
            ```

            See [README](https://github.com/Vesper36/mimo) for full documentation.
