<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #09090b;
      color: #e2e8f0;
      padding: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
    }
    .logo h1 { font-size: 18px; font-weight: 700; }
    .tabs {
      display: flex; gap: 4px; margin-bottom: 12px;
      background: #13131a; border-radius: 8px; padding: 3px;
    }
    .tab {
      flex: 1; padding: 6px; text-align: center;
      border-radius: 6px; font-size: 12px; font-weight: 500;
      cursor: pointer; color: #94a3b8;
      border: none; background: none;
    }
    .tab.active { background: #7c3aed; color: white; }
    .panel { display: none; }
    .panel.active { display: block; }
    .drop-zone {
      border: 2px dashed #2d2d3f; border-radius: 10px;
      padding: 24px 16px; text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #7c3aed; background: rgba(124, 58, 237, 0.05);
    }
    .drop-zone svg { margin: 0 auto 8px; display: block; }
    .drop-zone p { font-size: 13px; color: #94a3b8; }
    .drop-zone .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    input, select {
      width: 100%; padding: 8px 12px;
      background: #13131a; border: 1px solid #2d2d3f;-radius: 8px; color: #e2e8f0;
      font-size: 13px; outline: none;
    }
    input:focus { border-color: #7c3aed; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; margin-top: 10px; }
    .btn {
      width: 100%; padding: 10px; margin-top: 12px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #1e1e2a; color: #a78bfa;
      border: 1px solid #2d2d3f;
    }
    .result {
      background: #13131a; border: 1px solid #1e1e2a;
      border-radius: 8px; padding: 10px; margin-top: 10px;
    }
    .result .url {
      font-size: 12px; color: #a78bfa;
      word-break: break-all; margin-bottom: 8px;
    }
    .copy-btn {
      padding: 6px 12px; font-size: 12px;
      background: #7c3aed; color: white;
      border: none; border-radius: 6px; cursor: pointer;
    }
    .progress-bar {
      width: 100%; height: 4px; background: #1e1e2a;
      border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%; background: linear-gradient(90deg, #7c3aed, #4f46e5);
      border-radius: 2px; transition: width 0.3s;
    }
    .status { font-size: 11px; color: #64748b; margin-top: 6px; }
    .error { color: #f87171; font-size: 12px; margin-top: 8px; }
    .connected { color: #4ade80; font-size: 12px; }
    .file-list { margin-top: 8px; max-height: 120px; overflow-y: auto; }
    .file-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; background: #13131a; border-radius: 6px;
      margin-top: 4px; font-size: 12px;
    }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .size { color: #64748b; font-size: 11px; }
    .file-item .remove { cursor: pointer; color: #64748b; }
    .file-item .remove:hover { color: #f87171; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">L</div>
    <h1>LoBeam</h1>
    <span id="status" style="margin-left:auto"></span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="upload">Upload</button>
    <button class="tab" data-tab="clipboard">Clipboard</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <!-- Upload Panel -->
  <div id="upload" class="panel active">
    <div class="drop-zone" id="dropZone">
      <svg width="32" height="32" fill="none" stroke="#94a3b8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <p>Drop files here or click to browse</p>
      <p class="hint">Any file type, any size</p>
      <input type="file" id="fileInput" multiple style="display:none">
    </div>

    <div id="fileList" class="file-list"></div>

    <div id="uploadOptions" style="display:none">
      <label>Max downloads</label>
      <input type="number" id="maxDownloads" value="100" min="1">
      <label>Expires after (hours)</label>
      <input type="number" id="expiryHours" value="24" min="1">
    </div>

    <div id="uploadProgress" style="display:none">
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="progressStatus"></div>
    </div>

    <div id="uploadResult" class="result" style="display:none">
      <div class="url" id="resultUrl"></div>
      <button class="copy-btn" id="copyBtn">Copy link</button>
    </div>

    <div id="uploadError" class="error" style="display:none"></div>

    <button class="btn" id="uploadBtn" style="display:none">Upload files</button>
  </div>

  <!-- Clipboard Panel -->
  <div id="clipboard" class="panel">
    <label>Content</label>
    <textarea id="clipContent" rows="5" style="width:100%;padding:8px 12px;background:#13131a;border:1px solid #2d2d3f;border-radius:8px;color:#e2e8f0;font-size:13px;resize:vertical;outline:none;font-family:monospace" placeholder="Paste text, code, or notes..."></textarea>
    <label>Language (optional)</label>
    <input type="text" id="clipLang" placeholder="javascript, python, go...">
    <button class="btn" id="clipBtn">Create clipboard link</button>
    <div id="clipResult" class="result" style="display:none">
      <div class="url" id="clipUrl"></div>
      <button class="copy-btn" id="clipCopyBtn">Copy link</button>
    </div>
    <div id="clipError" class="error" style="display:none"></div>
  </div>

  <!-- Settings Panel -->
  <div id="settings" class="panel">
    <label>Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://lobeam.demo.vesper36.cc">
    <label>API Token (optional)</label>
    <input type="password" id="apiToken" placeholder="Leave empty for anonymous">
    <button class="btn" id="saveBtn">Save settings</button>
    <div id="saveStatus" style="display:none;margin-top:8px;font-size:12px;color:#4ade80">Saved!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
