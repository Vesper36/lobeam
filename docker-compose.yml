services:
  lobeam:
    build: .
    container_name: lobeam
    restart: unless-stopped
    ports:
      - "50030:50030"
    volumes:
      - lobeam-data:/data
    environment:
      - LOBEAM_PUBLIC_URL=https://lobeam.demo.vesper36.cc
      - LOBEAM_JWT_SECRET=change-this-to-a-random-secret
      - LOBEAM_ALLOW_ANONYMOUS=true
      - LOBEAM_TRANSFER_EXPIRY_HOURS=24
      - LOBEAM_MAX_DOWNLOADS=100
      # SMTP (optional)
      # - LOBEAM_SMTP_HOST=smtp.example.com
      # - LOBEAM_SMTP_PORT=587
      # - LOBEAM_SMTP_USERNAME=user@example.com
      # - LOBEAM_SMTP_PASSWORD=password
      # - LOBEAM_SMTP_FROM=noreply@example.com

volumes:
  lobeam-data:
